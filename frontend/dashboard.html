<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globe — My Trips</title>
    <link rel="stylesheet" href="static/css/index.css">
    <link rel="stylesheet" href="static/css/dashboard.css">
</head>
<body>

<header>
    <div class="nav dash-nav">
        <a class="dash-nav__logo" href="index.html">Globe</a>
        <div class="dash-nav__right">
            <span class="dash-nav__username" id="navUsername"></span>
            <button class="theme-toggle" id="themeToggle" title="Switch theme"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <button class="login-button nav__profile-button dash-nav__logout" id="logoutBtn">Log out</button>
        </div>
    </div>
    <div class="dash-header">
        <div class="dash-header__greeting" id="greeting">Welcome back!</div>
        <div class="dash-header__subtitle">Where are you traveling next?</div>
    </div>
</header>

<main>
    <div class="trips-section">
        <div class="trips-section__top">
            <div class="trips-section__title">My Trips</div>
            <button class="login-button trips-section__add-btn" id="addTripBtn">+ New Trip</button>
        </div>

        <div class="trips-grid" id="tripsGrid"></div>

        <div class="trips-empty" id="tripsEmpty">
            <div class="trips-empty__icon"><svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
            <div class="trips-empty__text">No trips yet. Start planning your first adventure!</div>
            <button class="login-button" id="addTripBtnEmpty">+ New Trip</button>
        </div>
    </div>
</main>
<div class="modal-overlay" id="newTripModal">
    <div class="modal">
        <button class="modal__close" id="closeTripModal"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        <div class="modal__title">New Trip</div>
        <form class="modal-form" id="newTripForm">
            <div class="modal-form__field">
                <label class="modal-form__label">Trip Name</label>
                <input class="modal-form__input" type="text" id="tripName" placeholder="Summer in Italy" required>
            </div>
            <div class="modal-form__field">
                <label class="modal-form__label">Destination</label>
                <input class="modal-form__input" type="text" id="tripDestination" placeholder="Rome, Italy" required>
            </div>
            <div class="modal-form__row">
                <div class="modal-form__field">
                    <label class="modal-form__label">Start Date</label>
                    <input class="modal-form__input" type="date" id="tripStartDate" required>
                </div>
                <div class="modal-form__field">
                    <label class="modal-form__label">End Date</label>
                    <input class="modal-form__input" type="date" id="tripEndDate" required>
                </div>
            </div>
            <div class="modal-form__field">
                <label class="modal-form__label">Budget ($) <span class="modal-form__optional">optional</span></label>
                <input class="modal-form__input" type="number" id="tripBudget" placeholder="2000" min="0">
            </div>
            <div class="modal-form__error" id="newTripError"></div>
            <button class="login-button modal-form__submit" type="submit">Create Trip</button>
        </form>
    </div>
</div>
<div class="modal-overlay" id="deleteModal">
    <div class="modal modal--small">
        <div class="modal__title">Delete Trip?</div>
        <div class="delete-modal__text">This action cannot be undone.</div>
        <div class="delete-modal__buttons">
            <button class="login-button delete-modal__confirm" id="deleteConfirmBtn">Delete</button>
            <button class="login-button delete-modal__cancel" id="deleteCancelBtn">Cancel</button>
        </div>
    </div>
</div>
<footer>
    <div class="footer__title">Globe</div>
    <div class="footer__text">Your Journey Starts Here<br>Helping travelers plan smarter, explore more, and worry less — since 2026.</div>
    <button class="login-button footer__button" id="footerLoginBtn" style="display:none">Login</button>
    <div class="footer__copyright">© 2025 All Rights Reserved</div>
</footer>
<script src="static/js/theme.js"></script>
<script src="static/js/dashboard.js"></script>
</body>
</html>
